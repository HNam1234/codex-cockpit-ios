name: Build signed IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Provisioning profile type
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - development

jobs:
  build:
    runs-on: macos-15
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'vn.nam.CodexCockpit' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate signing inputs
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$TEAM_ID"
          test -n "$SIGNING_IDENTITY"
          test -n "$P12_BASE64"
          test -n "$PROFILE_BASE64"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project and icon
        env:
          COCKPIT_APP_TOKEN: ${{ secrets.COCKPIT_APP_TOKEN }}
        run: |
          python3 scripts/generate_icon.py
          python3 scripts/generate_app_auth.py
          xcodegen generate

      - name: Import certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/codex-signing.keychain-db"
          echo -n "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive signed app
        run: |
          xcodebuild \
            -project CodexCockpit.xcodeproj \
            -scheme CodexCockpit \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath .build/CodexCockpit.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export signed IPA
        env:
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          mkdir -p .build/export
          cat > .build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>$SIGNING_IDENTITY</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath .build/CodexCockpit.xcarchive \
            -exportPath .build/export \
            -exportOptionsPlist .build/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: CodexCockpit-signed-${{ inputs.export_method }}
          path: .build/export/*.ipa
          if-no-files-found: error
