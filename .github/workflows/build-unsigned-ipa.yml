name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      capture_preview:
        description: Capture the full bilingual simulator preview set
        type: boolean
        default: true
      run_tests:
        description: Run unit and UI tests before packaging
        type: boolean
        default: true
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        env:
          COCKPIT_APP_TOKEN: ${{ secrets.COCKPIT_APP_TOKEN }}
        run: |
          python3 scripts/generate_icon.py
          python3 scripts/generate_app_auth.py
          xcodegen generate
      - name: Unit and UI tests on iOS Simulator
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          xcodebuild \
            -project CodexCockpit.xcodeproj \
            -scheme CodexCockpit \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            test

      - name: Capture simulator preview
        if: github.event_name != 'workflow_dispatch' || inputs.capture_preview
        continue-on-error: true
        timeout-minutes: 5
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          DEVICE_UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,re; name=sys.argv[1]; d=json.load(sys.stdin)["devices"]; c=[(tuple(map(int,re.findall(r"\d+",runtime))),x["udid"]) for runtime,devices in d.items() if "SimRuntime.iOS" in runtime for x in devices if x["name"] == name]; print(max(c)[1])' "$DEVICE")
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/CodexCockpit.app' -print -quit)
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 10
          mkdir -p .build/preview
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-home.png
          SIMCTL_CHILD_PREVIEW_TAB=profiles xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 5
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-accounts.png
          SIMCTL_CHILD_PREVIEW_TAB=profiles SIMCTL_CHILD_PREVIEW_DEVICE_SHEET=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 5
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-device-code.png
          SIMCTL_CHILD_PREVIEW_TAB=profiles SIMCTL_CHILD_PREVIEW_COCKPIT_OAUTH_ENTRY=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-oauth-entry.png
          SIMCTL_CHILD_PREVIEW_TAB=profiles SIMCTL_CHILD_PREVIEW_COCKPIT_OAUTH_RESULT=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-oauth-result.png
          SIMCTL_CHILD_PREVIEW_TAB=settings xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-settings.png
          SIMCTL_CHILD_PREVIEW_TAB=mail SIMCTL_CHILD_PREVIEW_MAIL_SAMPLE=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-mail.png
          SIMCTL_CHILD_PREVIEW_MAIL_SAMPLE=1 SIMCTL_CHILD_PREVIEW_MAIL_OPEN_INBOX=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-mail-inbox.png
          SIMCTL_CHILD_PREVIEW_MAIL_SAMPLE=1 SIMCTL_CHILD_PREVIEW_MAIL_OPEN_MESSAGE=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-mail-message.png
          xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(en)' -AppleLocale en_US
          sleep 5
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-home-en.png
          SIMCTL_CHILD_PREVIEW_TAB=profiles xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(en)' -AppleLocale en_US
          sleep 5
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-accounts-en.png
          SIMCTL_CHILD_PREVIEW_TAB=profiles SIMCTL_CHILD_PREVIEW_DEVICE_SHEET=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(en)' -AppleLocale en_US
          sleep 5
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-device-code-en.png
          SIMCTL_CHILD_PREVIEW_TAB=profiles SIMCTL_CHILD_PREVIEW_COCKPIT_OAUTH_ENTRY=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(en)' -AppleLocale en_US
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-oauth-entry-en.png
          SIMCTL_CHILD_PREVIEW_TAB=profiles SIMCTL_CHILD_PREVIEW_COCKPIT_OAUTH_RESULT=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(en)' -AppleLocale en_US
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-oauth-result-en.png
          SIMCTL_CHILD_PREVIEW_TAB=settings xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(en)' -AppleLocale en_US
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-settings-en.png
          SIMCTL_CHILD_PREVIEW_TAB=mail SIMCTL_CHILD_PREVIEW_MAIL_SAMPLE=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(en)' -AppleLocale en_US
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-mail-en.png
          SIMCTL_CHILD_PREVIEW_MAIL_SAMPLE=1 SIMCTL_CHILD_PREVIEW_MAIL_OPEN_INBOX=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(en)' -AppleLocale en_US
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-mail-inbox-en.png
          SIMCTL_CHILD_PREVIEW_MAIL_SAMPLE=1 SIMCTL_CHILD_PREVIEW_MAIL_OPEN_MESSAGE=1 xcrun simctl launch --terminate-running-process "$DEVICE_UDID" vn.nam.CodexCockpit -AppleLanguages '(en)' -AppleLocale en_US
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot .build/preview/cockpit-mail-message-en.png
      - name: Build device app without signing
        run: |
          xcodebuild \
            -project CodexCockpit.xcodeproj \
            -scheme CodexCockpit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p .build/Payload
          cp -R .build/DerivedData/Build/Products/Release-iphoneos/CodexCockpit.app .build/Payload/
          cd .build
          zip -qry CodexCockpit-unsigned.ipa Payload
      - name: Encrypt personalized IPA on public runners
        if: github.event.repository.private == false
        run: |
          openssl cms -encrypt -binary -aes-256-cbc \
            -in .build/CodexCockpit-unsigned.ipa \
            -out .build/CodexCockpit-unsigned.ipa.cms \
            -outform DER \
            .github/ci-artifact-recipient.pem
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private == true
        with:
          name: CodexCockpit-unsigned
          path: .build/CodexCockpit-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private == false
        with:
          name: CodexCockpit-unsigned-encrypted
          path: .build/CodexCockpit-unsigned.ipa.cms
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CodexCockpit-preview
          path: .build/preview/*.png
          if-no-files-found: warn
