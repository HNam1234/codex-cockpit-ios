name: CodexCockpit
options:
  bundleIdPrefix: vn.nam
  developmentLanguage: vi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    MARKETING_VERSION: "1.9.0"
    CURRENT_PROJECT_VERSION: "23"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  CodexCockpit:
    type: application
    platform: iOS
    sources:
      - path: CodexCockpit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.nam.CodexCockpit
        PRODUCT_NAME: CodexCockpit
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Codex Cockpit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSFaceIDUsageDescription: Khóa các phiên Codex và dashboard bằng Face ID.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIRequiresFullScreen: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  CodexCockpitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CodexCockpitTests
    dependencies:
      - target: CodexCockpit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.nam.CodexCockpitTests
        GENERATE_INFOPLIST_FILE: true
  CodexCockpitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CodexCockpitUITests
    dependencies:
      - target: CodexCockpit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.nam.CodexCockpitUITests
        GENERATE_INFOPLIST_FILE: true
schemes:
  CodexCockpit:
    build:
      targets:
        CodexCockpit: all
        CodexCockpitTests: [test]
        CodexCockpitUITests: [test]
    test:
      targets:
        - CodexCockpitTests
        - CodexCockpitUITests
